version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
